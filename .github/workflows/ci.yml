name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Scan repository for secrets
        run: npm run secret:scan

      - name: Run unit tests
        run: npm test

      - name: Run JavaScript syntax check
        run: npm run typecheck

      - name: Lint maintained P2 and catalog scope
        run: npm run lint:ci

      - name: Build Mini Program npm dependencies
        run: npm run build:miniprogram

      - name: Audit production dependencies
        run: npm run dependency:check

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example -f deploy/docker/compose.yaml config --quiet

      - name: Build and test P3 backend
        working-directory: services/backend
        run: bash mvnw -q package -Dmaven.test.skip=false -DskipTests=false

      - name: Install locked admin dependencies
        run: pnpm --dir apps/admin install --frozen-lockfile

      - name: Lint and type-check admin
        run: |
          pnpm --dir apps/admin run lint
          pnpm --dir apps/admin exec vue-tsc --noEmit

      - name: Build admin
        run: pnpm --dir apps/admin run build:prod

      - name: Report full legacy lint baseline
        continue-on-error: true
        run: npm run lint:baseline

      - name: Report all dependency findings
        continue-on-error: true
        run: npm run dependency:report
